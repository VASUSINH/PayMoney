name: paymoney

x-service: &service
  restart: on-failure
  env_file: environmentFile.env
  networks: [paymoney-net]

x-infra-env: &infra-env
  DB_HOST: postgres
  DB_PORT: "5432"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  EUREKA_URL: http://discovery-server:8761/eureka
  CONFIG_SERVER_URL: http://config-server:8888

services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [paymoney-net]

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [paymoney-net]

  kafka:
    image: apache/kafka:4.0.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    networks: [paymoney-net]

  discovery-server:
    <<: *service
    build:
      context: .
      dockerfile: discovery-server/Dockerfile
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  config-server:
    <<: *service
    build:
      context: .
      dockerfile: config-server/Dockerfile
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8888/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  api-gateway:
    <<: *service
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    environment: *infra-env
    ports:
      - "8080:8080"
    depends_on:
      config-server: {condition: service_healthy}
      discovery-server: {condition: service_healthy}
      redis: {condition: service_healthy}

  # Ports 8081-8084 are bound to 127.0.0.1 (only your own machine, for Swagger).
  # The real entry point for clients is the api-gateway on 8080.
  user-service:
    <<: *service
    build:
      context: .
      dockerfile: user-service/Dockerfile
    environment: *infra-env
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      config-server: {condition: service_healthy}
      discovery-server: {condition: service_healthy}
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}

  wallet-service:
    <<: *service
    build:
      context: .
      dockerfile: wallet-service/Dockerfile
    environment: *infra-env
    ports:
      - "127.0.0.1:8082:8082"
    depends_on:
      config-server: {condition: service_healthy}
      discovery-server: {condition: service_healthy}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}

  payment-service:
    <<: *service
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    environment: *infra-env
    ports:
      - "127.0.0.1:8083:8083"
    depends_on:
      config-server: {condition: service_healthy}
      discovery-server: {condition: service_healthy}
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}

  audit-service:
    <<: *service
    build:
      context: .
      dockerfile: audit-service/Dockerfile
    environment: *infra-env
    ports:
      - "127.0.0.1:8084:8084"
    depends_on:
      config-server: {condition: service_healthy}
      discovery-server: {condition: service_healthy}
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}

networks:
  paymoney-net:

volumes:
  postgres-data:
  kafka-data: