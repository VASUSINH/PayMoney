spring.application.name=PayMoney
server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

jwt.secret=${JWT_SECRET}

app.admin.email=${PAYMONEY_ADMIN_EMAIL}
app.admin.password=${PAYMONEY_ADMIN_PASSWORD}

razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}

logging.level.org.springframework.security=INFO

spring.jackson.time-zone=Asia/Kolkata

management.endpoints.web.exposure.include=health,info,flyway

app.public-base-url=${APP_PUBLIC_BASE_URL}

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=6


spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2s

spring.cache.type=redis
spring.cache.redis.time-to-live=2m
spring.cache.redis.cache-null-values=false

logging.level.org.springframework.cache=INFO
logging.level.org.springframework.data.redis.cache=INFO

