server.port=8080

# ---- Routes (lb:// = resolved through Eureka + client side load balancing)
spring.cloud.gateway.server.webmvc.routes[0].id=user-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://user-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/v1/register-user,/api/v1/auth/**,/api/v1/all-users,/api/v1/users/**

spring.cloud.gateway.server.webmvc.routes[1].id=wallet-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://wallet-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/v1/wallet,/api/v1/wallet/**,/api/v1/transfers,/api/v1/withdrawals,/api/v1/transactions/**

spring.cloud.gateway.server.webmvc.routes[2].id=payment-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://payment-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/v1/payment-links,/api/v1/payment-links/**,/api/v1/payment-link-verifications
