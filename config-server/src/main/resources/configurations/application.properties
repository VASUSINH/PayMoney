# ---------------------------------------------------------------
# Shared by every PayMoney microservice (served by Config Server)
# ---------------------------------------------------------------

jwt.secret=${JWT_SECRET}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

spring.jackson.time-zone=Asia/Kolkata

logging.level.org.springframework.security=INFO
logging.level.org.springframework.cache=INFO
logging.level.org.springframework.data.redis.cache=INFO

management.endpoints.web.exposure.include=health,info,flyway

spring.flyway.enabled=true

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2s

# ---- Service discovery
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# ---- Kafka (JSON events, type information travels in the record headers)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.consumer.group-id=${spring.application.name}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.PayMoney.DTO

app.kafka.topics.user-registered=user-registered
app.kafka.topics.user-updated=user-updated
app.kafka.topics.audit-log=audit-log

# ---- Key that internal (service-to-service) endpoints require in the X-Internal-Key header
internal.api.key=${INTERNAL_API_KEY}

# ---- Kafka: don't hang a request for 60s when Kafka is down; create topics only if broker is reachable
spring.kafka.producer.properties.max.block.ms=2000
spring.kafka.admin.fail-fast=true

# ---- Feign timeouts (ms) so a slow service cannot hang the caller
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=5000
